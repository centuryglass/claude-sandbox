[package]
name = "lumin"
version = "0.1.0"
edition = "2024"
description = "A ray tracer, and a gallery of deliberately broken reflection/refraction shaders"
license = "Unlicense"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg"] }
rand = "0.8"
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
ron = "0.8"

[profile.release]
opt-level = 3
lto = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
